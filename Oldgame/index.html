<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Pył i Rdza — Najemnicy</title>
<style>
  :root {
    --bg: #0b0a09; --panel: #1a1612ee; --panel2: #241e18; --edge: #6b5233; --edge-hi: #c08a3e;
    --text: #e8dcc0; --dim: #9a8b70; --amber: #f2a93b; --rust: #b4532a; --toxic: #8fd14f;
    --blood: #c43d2f; --steel: #7f9aa8; --good: #7fc46a; --bad: #e0553f;
    --font: "Menlo", "Consolas", "DejaVu Sans Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; user-select: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-size: calc(clamp(10px, min(1.25vw, 2.2222vh), 34px) * var(--ui-scale, 1)); }
  #ui > * { pointer-events: auto; }
  #ui .passthru { pointer-events: none; }
  #ui .passthru * { pointer-events: auto; }
  .panel { background: var(--panel); border: 3px solid var(--edge); box-shadow: inset 0 0 0 1px #000, 0 0 0 1px #000, 4px 4px 0 #0008; padding: .8em; image-rendering: pixelated; }
  .panel h2, .panel h3 { margin: 0 0 .5em; color: var(--amber); text-transform: uppercase; letter-spacing: .08em; font-size: 1.1em; text-shadow: 2px 2px 0 #000; }
  .btn { font: inherit; color: var(--text); background: var(--panel2); border: 2px solid var(--edge); padding: .35em .9em; cursor: pointer; text-transform: uppercase; letter-spacing: .05em; box-shadow: 2px 2px 0 #000; }
  .btn:hover:not(:disabled) { border-color: var(--edge-hi); color: #fff; background: #3a2c1e; }
  .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { border-color: var(--amber); color: var(--amber); }
  .btn.danger { border-color: var(--blood); color: var(--bad); }
  .dim { color: var(--dim); } .amber { color: var(--amber); } .good { color: var(--good); } .bad { color: var(--bad); } .toxic { color: var(--toxic); }
  .toast { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); z-index: 50; pointer-events: none !important; animation: toastIn 2.6s forwards; }
  @keyframes toastIn { 0% { opacity: 0; transform: translate(-50%, -10px);} 10%,80% { opacity: 1; transform: translate(-50%,0);} 100% { opacity: 0; } }
  .modal-back { position: absolute; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 40; }
  .modal { max-width: 70%; min-width: 30%; }
  .modal .row { display: flex; gap: .6em; justify-content: flex-end; margin-top: 1em; flex-wrap: wrap; }
  .tooltip { position: absolute; z-index: 60; pointer-events: none !important; max-width: 22em; font-size: .9em; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--edge); } ::-webkit-scrollbar-track { background: #0006; }
  canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; }
  .settings-back { z-index: 70; }
  .settings { max-width: 86%; max-height: 92%; overflow: auto; min-width: 52%; }
  .settings h3 { color: var(--amber); font-size: .95em; margin: .2em 0 .45em; letter-spacing: .08em; text-transform: uppercase; }
  .set-cols { display: grid; grid-template-columns: 1fr 1.15fr; gap: 1.4em; }
  .set-res { display: flex; flex-direction: column; gap: .35em; }
  .set-res .btn { text-align: left; display: flex; flex-direction: column; gap: .1em; text-transform: none; }
  .set-res .btn small { font-size: .75em; }
  .set-row { display: flex; gap: .8em; align-items: center; justify-content: space-between; margin: .35em 0; }
  .set-row > span:first-child { min-width: 7.5em; }
  .set-seg { display: flex; gap: .3em; flex-wrap: wrap; justify-content: flex-end; }
  .set-seg .btn, .set-row .btn { padding: .2em .6em; font-size: .85em; }
  .btn.on { background: #3a2c1e; }
  .set-note { font-size: .8em; margin-top: .5em; }
  .name-input { font: inherit; color: var(--text); background: #0008; border: 2px solid var(--edge); padding: .25em .45em; min-width: 0; flex: 1; user-select: text; }
  .name-input:focus { outline: none; border-color: var(--amber); }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); }
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="view"></canvas><div id="ui"><div id="boot">ŁADOWANIE…</div></div></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
