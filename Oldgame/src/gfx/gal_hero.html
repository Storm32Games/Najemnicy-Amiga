<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>hero sheets</title>
<style>body{margin:0;background:#5e5850;color:#eee;font:11px monospace} .row{display:flex;align-items:flex-end;gap:2px;margin:2px 4px} .lb{width:90px;flex:none} canvas{image-rendering:pixelated;background:#6c665c;outline:1px solid #555048}</style></head>
<body><div id="out"></div>
<script type="module">
// Hero-agent contact sheet: ?who=soldier,scout,raider_thug,...&anims=idle,walk&k=3
import { analyze } from './look.js';
import { buildHeroSheet } from './hero.js';
const q = new URLSearchParams(location.search), k = +(q.get('k') || 3);
const CL = ['soldier', 'scout', 'medic', 'techie', 'scavenger', 'brute'];
const who = (q.get('who') || CL.join(',')).split(',');
const desc = (w) => {
  if (CL.includes(w)) return { classId: w, name: w };
  const m = w.match(/^r(\d)$/); if (m) return null;
  return { templateId: w, isEnemy: true, name: w };
};
const out = document.getElementById('out'); const only = q.get('f'); if (q.get('grid')) out.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px'; const t0 = performance.now(); let info = [];
for (const w of who) {
  const A = analyze(desc(w)); const S = buildHeroSheet(A);
  const anims = (q.get('anims') || Object.keys(S.info).join(',')).split(',');
  for (const an of anims) {
    const I = S.info[an]; if (!I) continue; const row = document.createElement('div'); row.className = 'row';
    const lb = document.createElement('div'); lb.className = 'lb'; lb.textContent = w + ' ' + an + ' ' + I.n; row.appendChild(lb);
    for (let f = 0; f < I.n; f++) { if (only != null && !only.split('.').includes(String(f))) continue; const c = document.createElement('canvas'); c.width = S.fw; c.height = S.fh; c.getContext('2d').drawImage(S.canvas, f * S.fw, I.row * S.fh, S.fw, S.fh, 0, 0, S.fw, S.fh); c.style.width = S.fw * k + 'px'; c.style.height = S.fh * k + 'px'; row.appendChild(c); }
    (q.get('grid') ? (lb.remove(), row.title = w) : 0); out.appendChild(row);
  }
  info.push(w + ':' + A.weapon + '/' + A.role);
}
window.__info = { ms: Math.round(performance.now() - t0), info };
</script></body></html>
