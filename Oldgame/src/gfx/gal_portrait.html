<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Portrait gallery</title>
<style>body{margin:0;padding:8px;background:#1b1714;color:#ddd;font:11px monospace} .row{display:flex;align-items:flex-end;gap:6px;margin:3px 0} .row span{width:110px;overflow:hidden} canvas{image-rendering:pixelated;display:block} .grid{display:flex;flex-wrap:wrap;gap:6px}</style></head>
<body><div id="out"></div>
<script type="module">
// Portrait gallery: ?mode=sizes (each desc at 32/48/64/96, magnified) | ?mode=big (only one size, k scale) &n=from,to
import { portraitCanvas } from './portraits.js';
import { RECRUITS } from '../data/recruits.js';
import { createCharacter, createEnemy, ENEMIES } from '../rules/index.js';
const q = new URLSearchParams(location.search), mode = q.get('mode') || 'sizes', set = q.get('set') || 'all';
const ds = [];
if (set !== 'enemies') for (const r of RECRUITS) ds.push(Object.assign(createCharacter(r), { recruitId: r.id }));
if (set !== 'party') for (const id of Object.keys(ENEMIES)) { const e = createEnemy(id); e.id = 'e_' + id; ds.push(e); }
if (set === 'extra' || set === 'all') { for (let i = 0; i < 4; i++) { const e = createEnemy(['raider_thug', 'raider_psycho', 'raider_gunner', 'raider_thug'][i]); e.id = 'v' + i * 7; ds.push(e); } }
const only = q.get('only'); if (only) { const keep = only.split(',').map(Number); const f = ds.filter((d, i) => keep.includes(i)); ds.length = 0; ds.push(...f); }
const out = document.getElementById('out'); const t0 = performance.now();
if (mode === 'sizes') {
  const sizes = (q.get('sizes') || '32,48,64,96').split(',').map(Number), disp = +(q.get('disp') || 2);
  for (const d of ds) { const row = document.createElement('div'); row.className = 'row'; const s = document.createElement('span'); s.textContent = d.name; row.appendChild(s);
    for (const z of sizes) { const c = portraitCanvas(d, z); c.style.width = c.style.height = (z * disp) + 'px'; row.appendChild(c); } out.appendChild(row); }
} else {
  const z = +(q.get('size') || 48), k = +(q.get('k') || 3); const g = document.createElement('div'); g.className = 'grid'; out.appendChild(g);
  for (const d of ds) { const c = portraitCanvas(d, z); c.style.width = c.style.height = (z * k) + 'px'; c.title = d.name; g.appendChild(c); }
}
console.log('ms', Math.round(performance.now() - t0));
</script></body></html>
