<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>GFX gallery</title>
<style>body{margin:0;background:#111;color:#ddd;font:12px monospace} nav{position:fixed;top:0;left:0;z-index:10000;background:#000c;padding:4px} nav a{color:#f2a93b;margin-right:10px}</style></head>
<body>
<nav><a href="?view=world">world</a><a href="?view=sprites">sprites</a><a href="?view=portraits">portraits</a><a href="?view=icons">icons</a><a href="?view=d20">d20</a></nav>
<div id="stage"></div><div id="ui"></div>
<script type="module">
import { buildGallery } from './gallery.js';
import * as G from './index.js';
const q = new URLSearchParams(location.search); const view = q.get('view') || 'world', mood = q.get('mood') || 'dusk';
if (view === 'portraits') {
  const ds = ['soldier', 'scout', 'medic', 'techie', 'scavenger', 'brute'].map((c, i) => ({ classId: c, name: 'n' + i, look: { mask: i == 3 } }));
  for (const e of ['raider_thug', 'raider_psycho', 'raider_shooter', 'raider_chief', 'kostucha', 'ghoul', 'wild_dog', 'giant_rat', 'giant_bug', 'rogue_drone', 'sentry_turret', 'robot']) ds.push({ templateId: e, isEnemy: true });
  buildGallery({ view, descs: ds, k: 3 });
} else if (view === 'icons') {
  buildGallery({ view, items: 'pistol revolver rifle sniper shotgun smg laser bow knife machete pipe hammer axe armor helmet shield stim bandage medkit grenade molotov smoke antirad food water junk tech chip battery key ammo fuel radio drone goggles box'.split(' '), abil: 'sword crosshair heart shield skull fire bolt drone eye fist shout stealth run explosion gun reload cross wrench star hammer bandage trap'.split(' ') });
} else if (view === 'd20') {
  document.getElementById('ui').style.cssText = 'position:fixed;inset:0;font-size:16px'; document.body.style.background = '#2a2018';
  const roll = () => G.showD20Roll({ d20: 1 + (Math.random() * 20 | 0), mod: 7, total: 0, dc: 18, degree: 2, label: 'Test' }).then(roll); roll();
} else buildGallery({ view, mood, zoom: +(q.get('zoom') || 1), cx: +(q.get('cx') || 0), cz: +(q.get('cz') || 0) });
</script></body></html>
